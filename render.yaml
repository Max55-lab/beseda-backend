services:
  - type: web
    name: beseda-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/beseda.db
    disk:
      name: beseda-data
      mountPath: /data
      sizeGB: 1